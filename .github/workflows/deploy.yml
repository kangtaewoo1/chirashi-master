name: Deploy to Cloudflare Workers & GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: 📥 Install dependencies
        run: |
          npm install
          cd chirashi && pip install -r requirements.txt
      
      - name: ✅ Run tests
        run: |
          cd chirashi && python -m py_compile app.py
      
      - name: 🔐 Authenticate with Cloudflare
        run: |
          echo "Setting up Cloudflare credentials..."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: 🚀 Deploy to Cloudflare Workers
        run: |
          npm install -g wrangler
          wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: 📝 Create deployment info
        run: |
          echo "## 배포 완료 ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **브랜드**: 찌라시 마스터 v6" >> $GITHUB_STEP_SUMMARY
          echo "- **배포 시간**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **커밋**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
