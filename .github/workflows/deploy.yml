name: Validate backend changes
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4 flask
      - name: Check backend syntax
        run: python -m py_compile chirashi/app.py chirashi/cafe24_gate.py chirashi/form_schema.py chirashi/hub_guard.py chirashi/hub_report.py chirashi/telpan_adapter.py
      - name: Run regression tests
        run: python -m unittest discover -s chirashi -p 'test_*.py' -v
# Production uses the existing /opt/chirashi/autodeploy.sh.
# The local watcher tests, pushes explicit files, invokes the updater and checks hashes + HTTPS.
# Do not replace the live Cloudflare proxy with a worker using a localhost backend.
